name: Publish GitHub release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch wheels.yml run ID
        required: true
        type: string
      tag:
        description: Release tag matching the package version
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate source build
        id: source
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            const id = Number(process.env.BUILD_RUN_ID);
            if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Invalid build ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.path !== '.github/workflows/wheels.yml') {
              throw new Error('Only successful main-branch release builds are allowed');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: npzsee-pypi
          path: incoming/pypi
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: npzsee-release
          path: incoming/release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and assemble release files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/prepare-github-release.py
      - name: Upload verified artifacts and publish the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$BUILD_SHA" --title "NPZSee $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" publication/github/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release view "$RELEASE_TAG" --json url,isDraft,assets --jq '{url,isDraft,assets:(.assets|length)}'
